<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Miranda Hub Key</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

:root {
    --red: #ff1744;
    --red-light: #ff4969;
    --red-dark: #87001e;
    --black: #020203;
    --black-2: #080809;
    --white: #ffffff;
    --gray: #8d8d8d;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    color: var(--white);

    font-family:
        "Orbitron",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(255, 0, 50, .23),
            transparent 35%
        ),
        radial-gradient(
            circle at 0% 100%,
            rgba(255, 0, 50, .12),
            transparent 32%
        ),
        #020203;
}


/* =========================================================
   BACKGROUND
========================================================= */

.background {
    position: fixed;
    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 0;
}


/* Main glow */

.background-glow {
    position: absolute;

    width: 500px;
    height: 500px;

    left: 50%;
    top: 45%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255, 23, 68, .10),
            transparent 68%
        );

    filter: blur(20px);

    animation:
        centralGlow 5s ease-in-out infinite alternate;
}

@keyframes centralGlow {

    0% {
        opacity: .45;
        transform:
            translate(-50%, -50%)
            scale(.85);
    }

    100% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1.2);
    }
}


/* =========================================================
   MOVING GRID
========================================================= */

.grid {
    position: absolute;

    width: 180%;
    height: 180%;

    left: -40%;
    top: -15%;

    opacity: .13;

    background-image:
        linear-gradient(
            rgba(255, 23, 68, .22) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255, 23, 68, .22) 1px,
            transparent 1px
        );

    background-size:
        55px 55px;

    transform:
        perspective(600px)
        rotateX(62deg);

    transform-origin:
        center bottom;

    animation:
        gridMove 12s linear infinite;
}

@keyframes gridMove {

    from {
        background-position:
            0 0;
    }

    to {
        background-position:
            0 550px;
    }
}


/* =========================================================
   FLOATING GLOWS
========================================================= */

.glow {
    position: absolute;

    border-radius: 50%;

    filter: blur(100px);

    pointer-events: none;
}

.glow.one {
    width: 420px;
    height: 420px;

    top: -180px;
    left: -130px;

    background:
        rgba(255, 0, 50, .20);

    animation:
        glowOne 7s ease-in-out infinite alternate;
}

.glow.two {
    width: 370px;
    height: 370px;

    right: -150px;
    bottom: -130px;

    background:
        rgba(255, 0, 50, .17);

    animation:
        glowTwo 9s ease-in-out infinite alternate;
}

@keyframes glowOne {

    from {
        transform:
            translate(0, 0)
            scale(.85);
    }

    to {
        transform:
            translate(100px, 80px)
            scale(1.3);
    }
}

@keyframes glowTwo {

    from {
        transform:
            translate(0, 0)
            scale(1);
    }

    to {
        transform:
            translate(-100px, -70px)
            scale(1.35);
    }
}


/* =========================================================
   PARTICLES
========================================================= */

.particles {
    position: absolute;
    inset: 0;
}

.particles span {
    position: absolute;

    bottom: -10px;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background:
        #ff1744;

    box-shadow:
        0 0 6px #ff1744,
        0 0 15px #ff1744,
        0 0 25px rgba(255,23,68,.5);

    animation:
        particleUp linear infinite;
}

.particles span:nth-child(1) {
    left: 5%;
    animation-duration: 7s;
}

.particles span:nth-child(2) {
    left: 12%;
    animation-duration: 11s;
}

.particles span:nth-child(3) {
    left: 21%;
    animation-duration: 9s;
}

.particles span:nth-child(4) {
    left: 32%;
    animation-duration: 14s;
}

.particles span:nth-child(5) {
    left: 44%;
    animation-duration: 10s;
}

.particles span:nth-child(6) {
    left: 55%;
    animation-duration: 13s;
}

.particles span:nth-child(7) {
    left: 67%;
    animation-duration: 8s;
}

.particles span:nth-child(8) {
    left: 79%;
    animation-duration: 12s;
}

.particles span:nth-child(9) {
    left: 90%;
    animation-duration: 15s;
}

.particles span:nth-child(10) {
    left: 97%;
    animation-duration: 9s;
}

@keyframes particleUp {

    0% {
        transform:
            translateY(0)
            scale(.4);

        opacity: 0;
    }

    15% {
        opacity: .9;
    }

    80% {
        opacity: .7;
    }

    100% {
        transform:
            translateY(-110vh)
            scale(1.8);

        opacity: 0;
    }
}


/* =========================================================
   ENERGY LINES
========================================================= */

.energy-line {
    position: absolute;

    width: 300px;
    height: 1px;

    opacity: .45;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff1744,
            transparent
        );

    box-shadow:
        0 0 12px #ff1744;
}

.energy-line.line-one {
    left: -350px;
    top: 24%;

    transform:
        rotate(-8deg);

    animation:
        lineRight 8s linear infinite;
}

.energy-line.line-two {
    right: -350px;
    top: 70%;

    transform:
        rotate(8deg);

    animation:
        lineLeft 10s linear infinite;
}

@keyframes lineRight {

    from {
        transform:
            translateX(0)
            rotate(-8deg);
    }

    to {
        transform:
            translateX(160vw)
            rotate(-8deg);
    }
}

@keyframes lineLeft {

    from {
        transform:
            translateX(0)
            rotate(8deg);
    }

    to {
        transform:
            translateX(-160vw)
            rotate(8deg);
    }
}


/* =========================================================
   NAVBAR
========================================================= */

.navbar {
    position: fixed;

    top: 18px;
    left: 50%;

    width: min(94%, 920px);
    height: 66px;

    transform:
        translateX(-50%);

    display: flex;

    align-items: center;
    justify-content: space-between;

    padding:
        0 20px;

    border:
        1px solid
        rgba(255, 23, 68, .30);

    border-radius: 20px;

    background:
        rgba(5, 4, 5, .76);

    backdrop-filter:
        blur(22px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.65),
        inset 0 0 30px rgba(255,23,68,.03);

    z-index: 100;

    animation:
        navbarIn .8s ease;
}

@keyframes navbarIn {

    from {
        opacity: 0;

        transform:
            translate(-50%, -30px);
    }

    to {
        opacity: 1;

        transform:
            translate(-50%, 0);
    }
}


/* Navbar animated top line */

.navbar::before {
    content: "";

    position: absolute;

    top: -1px;
    left: 10%;

    width: 80%;
    height: 2px;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff1744,
            transparent
        );

    box-shadow:
        0 0 15px #ff1744;

    animation:
        navLine 3s ease-in-out infinite;
}

@keyframes navLine {

    0%,100% {
        opacity: .2;
        transform:
            scaleX(.35);
    }

    50% {
        opacity: 1;
        transform:
            scaleX(1);
    }
}


/* =========================================================
   BRAND
========================================================= */

.brand {
    display: flex;

    align-items: center;

    gap: 12px;

    font-size: 12px;

    font-weight: 900;

    letter-spacing: 2px;
}

.brand-logo {
    position: relative;

    width: 40px;
    height: 40px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 12px;

    color: #fff;

    font-size: 18px;
    font-weight: 900;

    background:
        linear-gradient(
            145deg,
            #ff1744,
            #75001a
        );

    box-shadow:
        0 0 18px
        rgba(255,23,68,.45);

    animation:
        brandPulse 2s ease-in-out infinite;
}

.brand-logo::before {
    content: "";

    position: absolute;

    inset: -4px;

    border-radius: 15px;

    border:
        1px solid
        rgba(255,23,68,.5);

    animation:
        brandRing 2s linear infinite;
}

@keyframes brandPulse {

    0%,100% {
        box-shadow:
            0 0 15px
            rgba(255,23,68,.35);
    }

    50% {
        box-shadow:
            0 0 35px
            rgba(255,23,68,.75);
    }
}

@keyframes brandRing {

    0% {
        opacity: 1;
        transform:
            scale(.9);
    }

    100% {
        opacity: 0;
        transform:
            scale(1.35);
    }
}


/* =========================================================
   MENU
========================================================= */

.menu {
    display: flex;

    align-items: center;

    gap: 6px;
}

.menu a {
    position: relative;

    padding:
        11px 15px;

    border-radius: 11px;

    color: #888;

    font-size: 10px;
    font-weight: 700;

    text-decoration: none;

    transition:
        .3s;
}

.menu a::before {
    content: "";

    position: absolute;

    inset: 0;

    border-radius: inherit;

    border:
        1px solid
        transparent;

    transition:
        .3s;
}

.menu a::after {
    content: "";

    position: absolute;

    left: 50%;
    bottom: 5px;

    width: 0;
    height: 2px;

    transform:
        translateX(-50%);

    border-radius: 10px;

    background:
        #ff1744;

    box-shadow:
        0 0 10px #ff1744;

    transition:
        .3s;
}

.menu a:hover {
    color: white;

    background:
        rgba(255,23,68,.08);

    transform:
        translateY(-2px);
}

.menu a:hover::before {
    border-color:
        rgba(255,23,68,.25);
}

.menu a:hover::after {
    width: 50%;
}


/* =========================================================
   MAIN
========================================================= */

main {
    position: relative;

    z-index: 5;

    min-height: 100vh;

    display: flex;

    align-items: center;
    justify-content: center;

    padding:
        120px 20px 60px;
}


/* =========================================================
   CARD
========================================================= */

.card {
    position: relative;

    width: min(100%, 480px);

    padding:
        42px 36px;

    overflow: hidden;

    border:
        1px solid
        rgba(255,23,68,.30);

    border-radius: 32px;

    background:
        linear-gradient(
            145deg,
            rgba(20,8,11,.95),
            rgba(5,5,6,.94)
        );

    backdrop-filter:
        blur(25px);

    box-shadow:
        0 40px 120px rgba(0,0,0,.82),
        0 0 80px rgba(255,0,50,.08);

    transform-style:
        preserve-3d;

    transition:
        transform .15s ease;

    animation:
        cardEnter 1s cubic-bezier(.2,.8,.2,1);
}

@keyframes cardEnter {

    from {
        opacity: 0;

        transform:
            translateY(60px)
            scale(.9);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* Card red glow */

.card::before {
    content: "";

    position: absolute;

    width: 300px;
    height: 300px;

    top: -190px;
    right: -150px;

    border-radius: 50%;

    background:
        #ff1744;

    filter:
        blur(120px);

    opacity: .13;

    pointer-events: none;
}


/* Card scan */

.card::after {
    content: "";

    position: absolute;

    top: 0;
    left: -80%;

    width: 60%;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff1744,
            transparent
        );

    box-shadow:
        0 0 20px #ff1744;

    animation:
        cardScan 4s linear infinite;
}

@keyframes cardScan {

    from {
        left: -80%;
    }

    to {
        left: 150%;
    }
}


/* =========================================================
   LOGO CONTAINER
========================================================= */

.logo-container {
    position: relative;

    width: 170px;
    height: 170px;

    margin:
        0 auto 24px;

    display: flex;

    align-items: center;
    justify-content: center;

    isolation: isolate;
}


/* =========================================================
   OUTER RING
========================================================= */

.logo-ring {
    position: absolute;

    width: 150px;
    height: 150px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    border:
        2px solid
        rgba(255,23,68,.22);

    border-top-color:
        #ff1744;

    border-bottom-color:
        #ff1744;

    box-shadow:
        0 0 25px
        rgba(255,23,68,.25);

    animation:
        ringRotate 5s linear infinite;
}

.logo-ring::before {
    content: "";

    position: absolute;

    inset: 10px;

    border-radius: 50%;

    border:
        1px dashed
        rgba(255,23,68,.4);

    animation:
        ringReverse 7s linear infinite;
}

@keyframes ringRotate {

    from {
        transform:
            translate(-50%, -50%)
            rotate(0deg);
    }

    to {
        transform:
            translate(-50%, -50%)
            rotate(360deg);
    }
}

@keyframes ringReverse {

    from {
        transform:
            rotate(0deg);
    }

    to {
        transform:
            rotate(-360deg);
    }
}


/* =========================================================
   ORBIT
========================================================= */

.orbit {
    position: absolute;

    width: 180px;
    height: 52px;

    left: 50%;
    top: 50%;

    margin-left: -90px;
    margin-top: -26px;

    border-radius: 50%;

    border:
        2px solid
        rgba(255,23,68,.62);

    box-shadow:
        0 0 18px
        rgba(255,23,68,.42);

    transform:
        rotate(-25deg);

    animation:
        orbitOne 4s linear infinite;
}

.orbit.two {
    transform:
        rotate(25deg);

    border-color:
        rgba(255,80,100,.28);

    animation:
        orbitTwo 6s linear infinite;
}

@keyframes orbitOne {

    from {
        transform:
            rotate(-25deg);
    }

    to {
        transform:
            rotate(335deg);
    }
}

@keyframes orbitTwo {

    from {
        transform:
            rotate(25deg);
    }

    to {
        transform:
            rotate(-335deg);
    }
}


/* =========================================================
   M LOGO
========================================================= */

.m-logo {
    position: absolute;

    width: 94px;
    height: 94px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 27px;

    overflow: hidden;

    color: white;

    background:
        linear-gradient(
            145deg,
            #ff4164 0%,
            #c00032 38%,
            #700019 70%,
            #250006 100%
        );

    border:
        2px solid
        rgba(255,110,130,.65);

    box-shadow:
        0 0 25px
        rgba(255,23,68,.45),

        0 0 65px
        rgba(255,23,68,.20),

        inset 0 0 25px
        rgba(255,255,255,.08);

    z-index: 10;

    animation:
        logoFloat 3s ease-in-out infinite,
        logoGlow 2s ease-in-out infinite alternate;
}


/* =========================================================
   M TEXT — ABSOLUTE CENTER
========================================================= */

.m-logo span {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    transform:
        translate(-50%, -50%);

    color: #ffffff;

    font-family:
        "Orbitron",
        Arial,
        sans-serif;

    font-size: 50px;

    font-weight: 900;

    line-height: 1;

    text-align: center;

    letter-spacing:
        -3px;

    padding: 0;
    margin: 0;

    text-indent: 0;

    z-index: 20;

    text-shadow:
        0 0 5px rgba(255,255,255,.8),
        0 0 15px rgba(255,23,68,.9),
        0 0 30px rgba(255,23,68,.55);
}


/* Inner border */

.m-logo::before {
    content: "";

    position: absolute;

    inset: 7px;

    border-radius: 20px;

    border:
        1px solid
        rgba(255,255,255,.20);

    box-shadow:
        inset 0 0 18px
        rgba(0,0,0,.55);

    z-index: 15;

    pointer-events: none;
}


/* Moving shine */

.m-logo::after {
    content: "";

    position: absolute;

    width: 180%;
    height: 32%;

    top: -35%;
    left: -130%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.38),
            transparent
        );

    transform:
        rotate(-35deg);

    z-index: 30;

    pointer-events: none;

    animation:
        logoShine 3.2s linear infinite;
}

@keyframes logoFloat {

    0%,100% {
        transform:
            translate(-50%, -50%)
            translateY(0)
            rotate(0deg);
    }

    50% {
        transform:
            translate(-50%, -50%)
            translateY(-8px)
            rotate(2deg);
    }
}

@keyframes logoGlow {

    from {
        box-shadow:
            0 0 20px
            rgba(255,23,68,.35),

            0 0 45px
            rgba(255,23,68,.15),

            inset 0 0 25px
            rgba(255,255,255,.06);
    }

    to {
        box-shadow:
            0 0 35px
            rgba(255,23,68,.75),

            0 0 90px
            rgba(255,23,68,.30),

            inset 0 0 30px
            rgba(255,255,255,.10);
    }
}

@keyframes logoShine {

    0% {
        left: -130%;
    }

    45%,100% {
        left: 130%;
    }
}


/* =========================================================
   TITLE
========================================================= */

.title {
    text-align: center;

    font-size:
        clamp(25px, 6vw, 38px);

    line-height: 1.2;

    font-weight: 900;

    letter-spacing:
        -1px;

    margin-bottom: 11px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #ff1744,
            #ffffff,
            #ff1744,
            #ffffff
        );

    background-size:
        300% auto;

    -webkit-background-clip:
        text;

    background-clip:
        text;

    -webkit-text-fill-color:
        transparent;

    animation:
        titleMove 5s linear infinite;
}

@keyframes titleMove {

    to {
        background-position:
            300% center;
    }
}


/* Subtitle */

.subtitle {
    text-align: center;

    color:
        #888;

    font-size:
        10px;

    line-height:
        1.8;

    margin-bottom:
        30px;
}


/* =========================================================
   KEY
========================================================= */

.label {
    display: block;

    color:
        #aaa;

    font-size:
        9px;

    font-weight:
        800;

    letter-spacing:
        2px;

    margin-bottom:
        9px;
}

.key-wrapper {
    position: relative;

    margin-bottom:
        17px;
}

.key-input {
    width: 100%;

    height: 59px;

    padding:
        0 17px;

    outline: none;

    border:
        1px solid
        rgba(255,23,68,.25);

    border-radius:
        15px;

    color:
        #fff;

    background:
        rgba(0,0,0,.62);

    font-family:
        monospace;

    font-size:
        11px;

    transition:
        .3s;
}

.key-input:hover {
    border-color:
        rgba(255,23,68,.55);
}

.key-input:focus {
    border-color:
        #ff1744;

    box-shadow:
        0 0 0 3px
        rgba(255,23,68,.08),

        0 0 30px
        rgba(255,23,68,.15);
}


/* =========================================================
   COPY BUTTON
========================================================= */

.copy-btn {
    position: relative;

    width: 100%;
    height: 59px;

    overflow: hidden;

    border:
        none;

    border-radius:
        15px;

    cursor:
        pointer;

    color:
        #fff;

    font-family:
        "Orbitron",
        sans-serif;

    font-size:
        11px;

    font-weight:
        900;

    letter-spacing:
        1.5px;

    background:
        linear-gradient(
            135deg,
            #ff1744,
            #a5002a
        );

    box-shadow:
        0 12px 35px
        rgba(255,23,68,.25);

    transition:
        .3s;
}

.copy-btn:hover {
    transform:
        translateY(-4px);

    box-shadow:
        0 18px 55px
        rgba(255,23,68,.45);
}

.copy-btn:active {
    transform:
        scale(.96);
}


/* Button shine */

.copy-btn::before {
    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 70%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.30),
            transparent
        );

    transform:
        skewX(-20deg);

    animation:
        buttonShine 2.8s infinite;
}

@keyframes buttonShine {

    0% {
        left: -100%;
    }

    45%,100% {
        left: 150%;
    }
}


/* =========================================================
   STATUS
========================================================= */

.status {
    min-height:
        25px;

    margin-top:
        16px;

    text-align:
        center;

    color:
        #ff4969;

    font-size:
        9px;

    font-weight:
        800;

    letter-spacing:
        1px;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {
    margin-top:
        25px;

    padding-top:
        18px;

    border-top:
        1px solid
        rgba(255,255,255,.06);

    text-align:
        center;

    color:
        #505050;

<script>

/* =========================================================
   COPY KEY
========================================================= */

function copyKey() {

    const input =
        document.getElementById(
            "keyInput"
        );

    const status =
        document.getElementById(
            "status"
        );

    const key =
        input.value;


    if (
        navigator.clipboard &&
        window.isSecureContext
    ) {

        navigator.clipboard
            .writeText(key)

            .then(() => {

                showSuccess();

            })

            .catch(() => {

                fallbackCopy();

            });

    } else {

        fallbackCopy();

    }


    function fallbackCopy() {

        input.focus();

        input.select();

        input.setSelectionRange(
            0,
            99999
        );

        try {

            document.execCommand(
                "copy"
            );

            showSuccess();

        } catch {

            status.innerText =
                "COPY THE KEY MANUALLY";

        }

    }


    function showSuccess() {

        status.innerText =
            "✓ KEY COPIED SUCCESSFULLY";

        setTimeout(
            () => {

                status.innerText =
                    "";

            },
            2500
        );

    }

}


/* =========================================================
   COPY BUTTON RIPPLE
========================================================= */

const copyButton =
    document.getElementById(
        "copyButton"
    );


copyButton.addEventListener(
    "click",
    function(event) {

        const rect =
            this.getBoundingClientRect();


        const ripple =
            document.createElement(
                "span"
            );


        ripple.className =
            "ripple";


        ripple.style.left =
            `${event.clientX - rect.left}px`;


        ripple.style.top =
            `${event.clientY - rect.top}px`;


        ripple.style.width =
            "10px";


        ripple.style.height =
            "10px";


        this.appendChild(
            ripple
        );


        ripple.animate(

            [
                {
                    width: "10px",
                    height: "10px",
                    opacity: 1
                },

                {
                    width: "600px",
                    height: "600px",
                    opacity: 0
                }
            ],

            {
                duration: 750,
                easing: "ease-out"
            }

        );


        setTimeout(
            () => {

                ripple.remove();

            },
            750
        );

    }
);


/* =========================================================
   KEY INPUT SELECT
========================================================= */

const keyInput =
    document.getElementById(
        "keyInput"
    );


keyInput.addEventListener(
    "click",
    function() {

        this.select();

    }
);


/* =========================================================
   3D CARD TILT
========================================================= */

const card =
    document.querySelector(
        ".card"
    );


document.addEventListener(
    "mousemove",
    function(event) {

        if (
            window.innerWidth < 700
        ) {
            return;
        }


        const centerX =
            window.innerWidth / 2;


        const centerY =
            window.innerHeight / 2;


        const rotateY =
            (centerX - event.clientX)
            / 75;


        const rotateX =
            (event.clientY - centerY)
            / 75;


        card.style.transform =
            `
            perspective(1100px)
            rotateX(${rotateX}deg)
            rotateY(${rotateY}deg)
            `;
    }
);


document.addEventListener(
    "mouseleave",
    function() {

        card.style.transform =
            `
            perspective(1100px)
            rotateX(0deg)
            rotateY(0deg)
            `;
    }
);


/* =========================================================
   MOUSE GLOW ON LOGO
========================================================= */

const mLogo =
    document.querySelector(
        ".m-logo"
    );


document.addEventListener(
    "mousemove",
    function(event) {

        if (
            window.innerWidth < 700
        ) {
            return;
        }


        const rect =
            mLogo.getBoundingClientRect();


        const x =
            event.clientX -
            (
                rect.left +
                rect.width / 2
            );


        const y =
            event.clientY -
            (
                rect.top +
                rect.height / 2
            );


        const distance =
            Math.sqrt(
                x * x +
                y * y
            );


        if (distance < 180) {

            mLogo.style.filter =
                "brightness(1.28)";

        } else {

            mLogo.style.filter =
                "brightness(1)";

        }

    }
);


/* =========================================================
   EXTRA FLOATING PARTICLES
========================================================= */

setInterval(
    function() {

        const particle =
            document.createElement(
                "div"
            );


        particle.style.position =
            "fixed";

        particle.style.left =
            Math.random() * 100 + "%";

        particle.style.bottom =
            "-10px";

        particle.style.width =
            (
                Math.random() * 3 +
                1
            ) + "px";

        particle.style.height =
            particle.style.width;

        particle.style.borderRadius =
            "50%";

        particle.style.background =
            "#ff1744";

        particle.style.boxShadow =
            "0 0 12px #ff1744";

        particle.style.pointerEvents =
            "none";

        particle.style.zIndex =
            "1";


        document.body.appendChild(
            particle
        );


        const duration =
            4000 +
            Math.random() * 6000;


        const animation =
            particle.animate(

                [
                    {
                        transform:
                            "translateY(0) scale(.4)",

                        opacity: 0
                    },

                    {
                        transform:
                            "translateY(-100vh) scale(1.5)",

                        opacity: .8
                    }
                ],

                {
                    duration:
                        duration,

                    easing:
                        "linear"
                }
            );


        animation.onfinish =
            function() {

                particle.remove();

            };

    },
    700
);


/* =========================================================
   PREVENT MOBILE CARD TILT
========================================================= */

window.addEventListener(
    "resize",
    function() {

        if (
            window.innerWidth < 700
        ) {

            card.style.transform =
                "none";

        }

    }
);

</script>
